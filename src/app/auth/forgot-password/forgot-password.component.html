<div class="forgot-password-container">

  <div class="forgot-password-card">

    <h1>Forgot Password?</h1>

    <p class="subtitle">
      Enter your email address and we'll help you reset your password.
    </p>

    <form (ngSubmit)="forgotPassword()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="forgotPasswordRequest.email"
          placeholder="Enter your email"
          required
        />

      </div>

      <!-- Error -->
      <div
        *ngIf="errorMessage"
        class="error-message"
      >
        {{ errorMessage }}
      </div>

      <!-- Success -->
      <div
        *ngIf="successMessage"
        class="success-message"
      >
        {{ successMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>

    </form>

    <div class="login-link">

      <button
        type="button"
        class="link-button"
        (click)="goToLogin()"
      >
        Back to Login
      </button>

    </div>

  </div>

</div>
