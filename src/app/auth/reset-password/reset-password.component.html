<div class="reset-password-container">

  <div class="reset-password-card">

    <h1>Reset Password</h1>

    <p class="subtitle">
      Enter a new password for your account.
    </p>

    <form (ngSubmit)="resetPassword()">

      <!-- New Password -->
      <div class="form-group">

        <label for="password">
          New Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="resetPasswordRequest.newPassword"
          placeholder="Enter your new password"
          required
        />

        <small>
          Password must be at least 8 characters.
        </small>

      </div>

      <!-- Confirm Password -->
      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm your new password"
          required
        />

      </div>

      <!-- Error -->
      <div
        *ngIf="errorMessage"
        class="error-message"
      >
        {{ errorMessage }}
      </div>

      <!-- Success -->
      <div
        *ngIf="successMessage"
        class="success-message"
      >
        {{ successMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading || !resetPasswordRequest.token"
      >
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>

    </form>

    <div class="login-link">

      <button
        type="button"
        class="link-button"
        (click)="goToLogin()"
      >
        Back to Login
      </button>

    </div>

  </div>

</div>
